<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mattywauna | Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
        }

        /* ========================= */
        /* MASTER HOMEPAGE           */
        /* ========================= */

        .homepage {
            position: relative;
            width: 100%;
            max-width: 1054px;

            aspect-ratio: 1054 / 1493;

            background-image: url("mattywauna-homepage-background.png");
            background-repeat: no-repeat;
            background-position: top center;
            background-size: 100% 100%;
        }


        /* ========================= */
        /* CLICKABLE NAVIGATION      */
        /* ========================= */

        .nav-hotspot {
            position: absolute;

            top: 1.5%;
            height: 2.5%;

            z-index: 100;

            display: block;

            cursor: pointer;

            background: transparent;
        }

        /* HOME */

        .home-link {
            left: 40.0%;
            width: 4.4%;
        }

        /* MUSIC */

        .music-link {
            left: 48.0%;
            width: 4.8%;
        }

        /* GOODS */

        .goods-link {
            left: 55.9%;
            width: 5.0%;
        }

        /* STORIES */

        .stories-link {
            left: 63.8%;
            width: 5.8%;
        }

        /* CONTACT */

        .contact-link {
            left: 71.7%;
            width: 6.3%;
        }


        /* ========================= */
        /* PRODUCT IMAGE OVERLAYS    */
        /* ========================= */

        .product {
            position: absolute;

            top: 51%;

            width: 14%;
            height: 14%;

            object-fit: contain;

            z-index: 10;

            display: none;
        }

        #product1 {
            left: 9.2%;
        }

        #product2 {
            left: 25%;
        }

        #product3 {
            left: 40.8%;
        }

        #product4 {
            left: 56.6%;
        }

        #product5 {
            left: 72.4%;
        }


        /* ========================= */
        /* PRODUCT LABELS            */
        /* ========================= */

        .product-name {
            position: absolute;

            top: 64.1%;

            width: 14%;
            height: 2.1%;

            display: none;

            align-items: center;
            justify-content: center;

            background: #c9a16c;
            color: #111;

            font-family: Arial, Helvetica, sans-serif;

            font-size: clamp(6px, 1vw, 13px);

            font-weight: 700;

            text-align: center;

            z-index: 20;
        }

        #name1 {
            left: 9.2%;
        }

        #name2 {
            left: 25%;
        }

        #name3 {
            left: 40.8%;
        }

        #name4 {
            left: 56.6%;
        }

        #name5 {
            left: 72.4%;
        }
    </style>
</head>


<body>

<div class="homepage">

    <!-- ========================= -->
    <!-- CLICKABLE NAVIGATION      -->
    <!-- ========================= -->

    <a
        class="nav-hotspot home-link"
        href="index.html"
        aria-label="Home">
    </a>

    <a
        class="nav-hotspot music-link"
        href="music.html"
        aria-label="Music">
    </a>

    <a
        class="nav-hotspot goods-link"
        href="goods.html"
        aria-label="Goods">
    </a>

    <a
        class="nav-hotspot stories-link"
        href="stories.html"
        aria-label="Stories">
    </a>

    <a
        class="nav-hotspot contact-link"
        href="contact.html"
        aria-label="Contact">
    </a>


    <!-- ========================= -->
    <!-- PRODUCT 1                -->
    <!-- ========================= -->

    <img
        id="product1"
        class="product"
        src=""
        alt=""
    >

    <div
        id="name1"
        class="product-name">
    </div>


    <!-- ========================= -->
    <!-- PRODUCT 2                -->
    <!-- ========================= -->

    <img
        id="product2"
        class="product"
        src=""
        alt=""
    >

    <div
        id="name2"
        class="product-name">
    </div>


    <!-- ========================= -->
    <!-- PRODUCT 3                -->
    <!-- ========================= -->

    <img
        id="product3"
        class="product"
        src=""
        alt=""
    >

    <div
        id="name3"
        class="product-name">
    </div>


    <!-- ========================= -->
    <!-- PRODUCT 4                -->
    <!-- ========================= -->

    <img
        id="product4"
        class="product"
        src=""
        alt=""
    >

    <div
        id="name4"
        class="product-name">
    </div>


    <!-- ========================= -->
    <!-- PRODUCT 5                -->
    <!-- ========================= -->

    <img
        id="product5"
        class="product"
        src=""
        alt=""
    >

    <div
        id="name5"
        class="product-name">
    </div>

</div>

</body>
</html>
