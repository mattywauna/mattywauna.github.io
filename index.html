<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mattywauna | Drop 001</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #000;
            width: 100%;
            min-height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
        }

        /*
        ==========================================
        MASTER HOMEPAGE BACKGROUND
        ==========================================
        */

        .homepage {
            position: relative;

            width: 100%;
            max-width: 1054px;

            aspect-ratio: 1054 / 1493;

            background-image:
                url("mattywauna-homepage-background.png");

            background-repeat: no-repeat;
            background-position: top center;
            background-size: 100% 100%;
        }

        /*
        ==========================================
        PRODUCT IMAGE SETTINGS
        ==========================================
        */

        .product {
            position: absolute;

            width: 14%;
            height: 14%;

            object-fit: contain;

            z-index: 10;
        }

        /*
        ==========================================
        SLOT 1
        ==========================================
        */

        #product1 {
            left: 9.2%;
            top: 51%;
        }

        /*
        ==========================================
        SLOT 2
        ==========================================
        */

        #product2 {
            left: 25%;
            top: 51%;
        }

        /*
        ==========================================
        SLOT 3
        ==========================================
        */

        #product3 {
            left: 40.8%;
            top: 51%;
        }

        /*
        ==========================================
        SLOT 4
        ==========================================
        */

        #product4 {
            left: 56.6%;
            top: 51%;
        }

        /*
        ==========================================
        SLOT 5
        ==========================================
        */

        #product5 {
            left: 72.4%;
            top: 51%;
        }

        /*
        ==========================================
        PRODUCT NAME LABELS
        ==========================================
        */

        .product-name {
            position: absolute;

            width: 14%;
            height: 2.1%;

            top: 64.1%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;

            font-size: clamp(6px, 1vw, 13px);

            color: #111;
            background: #c9a16c;

            text-align: center;

            z-index: 20;
        }

        #name1 {
            left: 9.2%;
        }

        #name2 {
            left: 25%;
        }

        #name3 {
            left: 40.8%;
        }

        #name4 {
            left: 56.6%;
        }

        #name5 {
            left: 72.4%;
        }

    </style>
</head>

<body>

<div class="homepage">

    <!-- PRODUCT 1 -->
    <img
        id="product1"
        class="product"
        src=""
        alt=""
        style="display:none;"
    >

    <div
        id="name1"
        class="product-name"
        style="display:none;">
    </div>


    <!-- PRODUCT 2 -->
    <img
        id="product2"
        class="product"
        src=""
        alt=""
        style="display:none;"
    >

    <div
        id="name2"
        class="product-name"
        style="display:none;">
    </div>


    <!-- PRODUCT 3 -->
    <img
        id="product3"
        class="product"
        src=""
        alt=""
        style="display:none;"
    >

    <div
        id="name3"
        class="product-name"
        style="display:none;">
    </div>


    <!-- PRODUCT 4 -->
    <img
        id="product4"
        class="product"
        src=""
        alt=""
        style="display:none;"
    >

    <div
        id="name4"
        class="product-name"
        style="display:none;">
    </div>


    <!-- PRODUCT 5 -->
    <img
        id="product5"
        class="product"
        src=""
        alt=""
        style="display:none;"
    >

    <div
        id="name5"
        class="product-name"
        style="display:none;">
    </div>

</div>

</body>
</html>
