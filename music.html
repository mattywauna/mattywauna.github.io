<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mattywauna | Music</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
        }


        /* ================================= */
        /* MUSIC PAGE                        */
        /* ================================= */

        .music-page {
            position: relative;

            width: 100%;
            max-width: 1054px;

            /* Exact dimensions of the Music image */
            aspect-ratio: 1054 / 1492;

            background-image: url("mattywauna-music-background.png");
            background-repeat: no-repeat;
            background-position: top center;
            background-size: 100% 100%;
        }


        /* ================================= */
        /* CLICKABLE NAVIGATION              */
        /* ================================= */

        .nav-hotspot {
            position: absolute;

            top: 1.3%;
            height: 2.2%;

            display: block;
            z-index: 100;

            cursor: pointer;
            background: transparent;
        }


        /* HOME */

        .home-link {
            left: 39.65%;
            width: 3.25%;
        }


        /* MUSIC */

        .music-link {
            left: 47.15%;
            width: 4.10%;
        }


        /* GOODS */

        .goods-link {
            left: 54.93%;
            width: 4.10%;
        }


        /* STORIES */

        .stories-link {
            left: 62.71%;
            width: 5.50%;
        }


        /* CONTACT */

        .contact-link {
            left: 72.01%;
            width: 5.60%;
        }

    </style>

</head>


<body>


<div class="music-page">


    <!-- HOME -->

    <a
        class="nav-hotspot home-link"
        href="index.html"
        aria-label="Home">
    </a>


    <!-- MUSIC -->

    <a
        class="nav-hotspot music-link"
        href="music.html"
        aria-label="Music">
    </a>


    <!-- GOODS -->

    <a
        class="nav-hotspot goods-link"
        href="goods.html"
        aria-label="Goods">
    </a>


    <!-- STORIES -->

    <a
        class="nav-hotspot stories-link"
        href="stories.html"
        aria-label="Stories">
    </a>


    <!-- CONTACT -->

    <a
        class="nav-hotspot contact-link"
        href="contact.html"
        aria-label="Contact">
    </a>


</div>


</body>

</html>
